<!DOCTYPE html>
<html lang="en">
<head>
<title>NamasteMart</title>
<meta charset="utf-8">
<meta name="viewport"content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined;opsz,wght,FILL,GRAD@48,400,0,0');
:root{
--layOut-Color:#b341ab;
--chatbot-toggler-Bg: var(--layOut-Color);
--chatbot-header-Bg: var(--layOut-Color);
--send-Btn-color: var(--layOut-Color);
--chatSend-Bg:var(--layOut-Color);
--robot-Bg: var(--layOut-Color);
--font-Color:#fff;
--ChatBot-Background:#fff;
--chatinput-Bg:#fff;
--incoming-Msg-color:#000;
--inputBorder-Color:#ccc;
--erroe-Msg-color:#721c24;
--erroe-Msg-Bg:#f8d7da;
}

*{
margin:0;
padding:0
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}


.chatbot-toggler{
position:fixed;
right:40px;
bottom:35px;
height:50px;
width:50px;
color:var(--font-Color);
border:none;
display:flex;
align-items:center;
justify-content:center;
outline:none;
background:var(--chatbot-toggler-Bg);
cursor:pointer;
border-radius:50%;
transition:all 0.6 ease;

}

.show-chatbot.chatbot-toggler{
transform:rotate(90deg);
}

.chatbot-toggler span{
position:absolute;
}

.show-chatbot.chatbot-toggler span:first-child{
opacity:1;
}

.chatbot{
position:fixed;
z-index:10;
right:40px;
bottom:100px;
width:420px;
transform:scale(0.5);
opacity:0;
pointer-events:none;
overflow:hidden;
Background:var(--ChatBot-Background);
border-radius:15px;
transform-origin:bottom right;
transition:all 0.5s ease;
box-shadow:0 0 128px 0 rgba(0,0,0,0.1),0 32px 64px -48px rgba(0,0,0,0.5);
}

.show-chatbot.chatbot{
transform:scale(1);
opacity:1;
pointer-events:auto;
}

.chatbot header{
Background:var(--chatbot-header-Bg);
padding:10px 0;
text-align:center;
position:relative;
}

.chatbot header span{
position:absolute;
right:20px;
top:50%;
color:var(--font-Color);
cursor:pointer;
display:none;
transform:translateY(-50%);
}

.chatbot header h2{
color:var(--font-Color);
font-size:2.4rem;
}

.chatbot.chatbox{
height:400px;
overflow-y:auto;
padding:20px 20px 100px;
}

.chatbox.chat{
display:flex;

}

.chatbox .incoming span{
height:32px;
width:32px;
color:var(--font-Color);
align-self:flex-end;
background:var(--robot-Bg);
text-align:center;
line-height:32px;
border-radius:4px;
margin:0 10px 7px 0;
}
.chatbox.outgoing{
margin:20px 0;
justify-content:flex-end;
}

.chatbox.chat p{
color:var(--font-Color);
max-width:75%;
font-size:1.4rem;
padding:12px 16px;
border-radius:10px 10px 0 10px;
background:var(--chatSend-Bg);
}


.chatbox.chat p.error{
color:var(--erroe-Msg-color);
background:var(--erroe-Msg-Bg);
}

.chatbox.incoming p{
color:var(--incoming-Msg-color);
background:var(--incoming-Msg-Bg);
border-radius:10px 10px 10px 0;
}

.chatbot.chat-input{
position:absolute;
bottom:0;
width:100%;
display:flex;
gap:5px;
background-color:var(--chatinput-Bg);
border-top:1px solid var(--inputBorder-Color);
}

.chat-input textarea{
height:55px;
width:100%;
border:none;
outline:none;
font-size:1.4rem;
resize:none;
max-height:180px;
padding:16px 15px 16px 0;
}

.chat-input span{
align-self:flex-end;
height:55px;
line-height:55px;
color:var(--send-Btn-color);
font-size:1.35rem;
cursor:pointer;
visibility:hidden;
}

.chat-input textarea:valid-span{
visibility:visible;
}

@media(max-width:490px){
.chatbot{
right:0;
bottom:0;
height:94%;
width:100%;
border-radius:0;

}

.chatbot.chatbox{
height:90%;

}
.chatbot header span{
display:block;
}
}
</style>
</head>
<body>


</body>
</html>
